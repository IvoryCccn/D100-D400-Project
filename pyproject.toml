[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-card-approval"
version = "0.1.0"
description = "Credit card approval prediction using GLM and LightGBM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
  "seaborn",
  "missingno",
  "scikit-learn",
  "lightgbm",
  "pyarrow",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "pre-commit",
  "notebook",
  "ipykernel",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"